# LISA evolution worker on GitHub Actions (free for public repositories).
# Replaces a paid Render background worker. It talks only to Supabase:
#   curate new device experience -> synthesize -> train (CPU PyTorch) -> gate
#   -> quantize -> sign -> upload + activate. Devices pick the model up via OTA.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SUPABASE_URL                https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   Supabase service_role key
#   OTA_SIGNING_KEY_PEM         the same private key as Render's OTA_SIGNING_KEY_PEM
#   GROQ_API_KEY                optional, only with repository variable TEACHER=groq (free plan)
#   ANTHROPIC_API_KEY           optional, only with repository variable TEACHER=claude
#
# Logs of public repositories are public. The worker never prints secrets.

name: LISA evolution

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours: train if enough new experience arrived
  workflow_dispatch:            # Actions tab -> LISA evolution -> Run workflow
    inputs:
      train_now:
        description: "Start a training run now (otherwise only queued or due runs)"
        type: boolean
        default: true
      force_publish:
        description: "Publish even if the new model doesn't beat the current one"
        type: boolean
        default: false

concurrency:
  group: lisa-evolution         # one worker at a time, as the pipeline expects
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-train.txt

      - name: Install (CPU PyTorch)
        run: pip install -r requirements-train.txt

      - name: Check configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$OTA_SIGNING_KEY_PEM" ] || missing="$missing OTA_SIGNING_KEY_PEM"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets:$missing"
            exit 1
          fi

      - name: Run the evolution worker once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEACHER: ${{ vars.TEACHER || 'rule' }}
          TRAINER: torch
          # The worker serves no HTTP, so it needs no shared admin token; any
          # non-default value satisfies the production config check.
          ADMIN_TOKEN: actions-worker-${{ github.run_id }}-${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          TRAIN_NOW: ${{ inputs.train_now }}
          FORCE: ${{ inputs.force_publish }}
        run: |
          args="--once"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TRAIN_NOW" = "true" ]; then args="$args --trigger"; fi
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python worker.py $args
