# Runs the evolution server's tests on every push and pull request.
# (Started from GitHub's conda template; the repo has no environment.yml, so it
# installs with pip like lisa-evolution.yml does, with CPU-only PyTorch.)
name: LISA server tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            server/requirements-train.txt
            server/requirements-dev.txt

      - name: Install (CPU PyTorch)
        run: pip install -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names only)
        run: flake8 . .. --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=.pio,.venv

      - name: Test (fast suite)
        run: pytest -q -m "not slow"
