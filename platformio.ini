; ==============================================================================
; LISA - firmware for the ESP32-S3 edge node (N16R8: 16 MB flash, 8 MB OPI PSRAM)
; External W25Q128 on SPI2: DI=GPIO11, CLK=GPIO12, DO=GPIO13, CS=GPIO10
; ==============================================================================
;   pio run -e edge_node -t upload      self-evolving node (UART + OTA + telemetry)
;   pio run -e lisa_chat -t upload      serial chat with the same model
; Copy edge/secrets.example.h to edge/secrets.h first (Wi-Fi, server URL, keys).
; Bring-up guide: docs/BRINGUP.md

[platformio]
default_envs = edge_node
src_dir = .

[env]
platform = espressif32@6.12.0          ; Arduino core 2.0.17 / ESP-IDF 4.4 (the code targets this)
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = gemma4/partitions_w25q128_host.csv
monitor_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O3
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -I gemma4
    -I .
    ; W25Q128 wiring on SPI2. Tie WP# and HOLD# to 3.3 V.
    -D W25_PIN_CS=10
    -D W25_PIN_MOSI=11
    -D W25_PIN_CLK=12
    -D W25_PIN_MISO=13

[env:edge_node]
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_src_filter = -<*> +<edge/edge_main.cpp>
build_flags =
    ${env.build_flags}
    -I edge
    ; Peripheral UART (UART1)
    -D EDGE_UART_RX_PIN=18
    -D EDGE_UART_TX_PIN=17

[env:lisa_chat]
build_src_filter = -<*> +<gemma4/gemma4_w25q128_cluster_main.cpp>
