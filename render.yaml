# Render Blueprint: LISA API on Render's FREE plan.
# New -> Blueprint -> pick this repo. Fill the env group values marked sync:false.
#
#   lisa-api   FastAPI (free web service): telemetry, OTA checks, UART classify, admin
#
# Training does NOT run on Render (free accounts have no background workers).
# It runs on GitHub Actions (.github/workflows/lisa-evolution.yml) or on your PC
# (cd server && python worker.py). The worker only needs Supabase, not Render.
#
# Free web services sleep after 15 minutes without traffic. A device online
# sends telemetry at least every minute, which keeps it awake; after a sleep the
# first request can take ~1 minute and the device simply retries.

services:
  - type: web
    name: lisa-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: RUN_EVOLUTION_INLINE
        value: "false"          # never train inside the API (512 MB, shared CPU); runs are queued
      - fromGroup: lisa

envVarGroups:
  - name: lisa
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OTA_SIGNING_KEY_PEM          # contents of server/secrets/ota_signing_key.pem
        sync: false
      - key: TEACHER
        value: rule
